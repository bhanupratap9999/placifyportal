services:
  - type: web
    name: placify-backend
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: placify-uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: UPLOADS_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: placify-frontend
    runtime: static
    rootDir: frontend25
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        sync: false
